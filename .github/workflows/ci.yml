name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run it interrupted — nothing here needs the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # go test compiles everything, so there is no separate build step. The
      # tests needing Ollama, pdflatex or a real cv.md skip themselves, which on
      # a runner is always.
      #
      # The gates are not here. They need the cached JD corpus and a real cv.md,
      # both of which are user data that is never committed, so they run
      # locally: npm run gate:fit and friends.
      - run: go test ./...
