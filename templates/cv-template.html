<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NAME}} — CV</title>
<style>
  /* ============================================================
     Modern-minimal CV template
     - Single accent colour, black body text, no gradients
     - System / ATS-safe sans fonts (Arial/Helvetica stack)
     - Single column, hairline dividers, airy spacing
     Change the accent in one place via --accent below.
     ============================================================ */

  :root {
    --accent: #601A24;        /* headings, rules, links */
    --ink: #1a1a1a;           /* primary body text */
    --ink-soft: #333333;      /* secondary text */
    --muted: #6b6b6b;         /* dates, locations, meta */
    --hairline: #dddddd;      /* divider lines */
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    font-family: Arial, Helvetica, "Helvetica Neue", sans-serif;
    font-size: 12.5px;
    line-height: 1.35;
    color: var(--ink);
    background: #ffffff;
    padding: 0;
    margin: 0;
  }

  .page {
    width: 100%;
    max-width: {{PAGE_WIDTH}};
    margin: 0 auto;
    padding: 2px 0;
  }

  /* === HEADER ===
     Centred as a block. The contact row goes with it: a centred name over a
     left-aligned row of contact details reads as a layout bug rather than a
     choice, and the row is one flex line either way. */
  .header {
    margin-bottom: 9px;
    text-align: center;
  }

  .header h1 {
    font-family: Arial, Helvetica, "Helvetica Neue", sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: normal;
    margin-bottom: 2px;
    line-height: 1.1;
  }

  /* The role being applied for, under the name. A CV that names the posting it
     is answering reads as written for it. Scaled with the name rather than held
     at 13px, so the two read as one header block; the pair costs 10px more than
     the 22/13 it replaces, against a mean 78px of one-page headroom. */
  .target-role {
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 5px;
    line-height: 1.2;
  }

  /* Thin accent rule under the name (kept class name for compatibility) */
  .header-gradient {
    height: 2px;
    background: var(--accent);
    margin-bottom: 6px;
  }

  .contact-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 12px;
    font-size: 11px;
    line-height: 1.4;
    color: var(--muted);
  }

  .contact-row a {
    color: var(--accent);
    text-decoration: none;
  }

  /* Phone and email are clickable (tel: / mailto:) but stay in the muted body
     colour. Accent is the CV's signal for "this goes somewhere on the web";
     colouring a phone number like a profile link says nothing and adds noise. */
  .contact-row a.contact-plain {
    color: var(--muted);
  }

  .contact-row .separator {
    color: var(--hairline);
  }

  /* === SECTIONS ===
     Spacing throughout this file is tuned against a measured one-page budget:
     an A4 content box at 0.45in margins is 708 x 1036 px, of which section
     chrome used to eat 728px before a word of content. Loosening any of these
     numbers takes the space straight out of bullet lines. */
  .section {
    margin-bottom: 9px;
  }

  .section-title {
    font-family: Arial, Helvetica, "Helvetica Neue", sans-serif;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    /* ponytail: no letter-spacing — Chrome's PDF writer turns tracking into
       per-glyph TJ offsets and ATS extractors read "W O R K  E X P E R I E N C E".
       Uppercase + bold + accent + rule already carry the hierarchy. */
    letter-spacing: normal;
    color: var(--accent);
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 3px;
    margin-bottom: 5px;
    line-height: 1.2;
  }

  /* === PROFESSIONAL SUMMARY === */
  .summary-text {
    font-size: 12px;
    line-height: 1.4;
    color: var(--ink-soft);
  }

  /* Links must never break across lines */
  a {
    white-space: nowrap;
  }

  /* === WORK EXPERIENCE ===
     Company, location, title and dates on ONE line. They used to occupy three
     (company+dates, then role, then location) for 51px a role; this is 34px. */
  .job {
    margin-bottom: 7px;
  }

  .job-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 2px;
  }

  .job-company {
    font-family: Arial, Helvetica, "Helvetica Neue", sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
  }

  /* Title and location, sharing the company's line. */
  .job-meta {
    font-size: 11px;
    color: var(--ink-soft);
  }

  .job-period {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  .job ul {
    padding-left: 16px;
    margin-top: 2px;
  }

  .job li {
    font-size: 12px;
    line-height: 1.3;
    color: var(--ink-soft);
    margin-bottom: 2px;
  }

  .job li strong {
    font-weight: 700;
    color: var(--ink);
  }

  /* === PROJECTS === */
  .project {
    margin-bottom: 6px;
  }

  .project-title {
    font-family: Arial, Helvetica, "Helvetica Neue", sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
  }

  /* Flat accent label, no background */
  .project-badge {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: normal;
    color: var(--accent);
    margin-left: 8px;
  }

  .project-desc {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 3px;
    line-height: 1.35;
  }

  /* Projects render as bullets when the writer supplies them, matching the
     experience list exactly — a project's evidence is the same kind of thing as
     a job's, and styling it differently only suggests it counts for less. */
  .project-bullets {
    padding-left: 16px;
    margin-top: 3px;
  }

  .project-bullets li {
    font-size: 12px;
    line-height: 1.3;
    color: var(--ink-soft);
    margin-bottom: 2px;
  }

  .project-bullets li strong {
    font-weight: 700;
    color: var(--ink);
  }

  .project-tech {
    font-size: 10px;
    color: var(--muted);
    margin-top: 3px;
  }

  /* The repo link inherits the tech line's colour rather than taking the browser
     default, which would put three blue URLs in an otherwise grey row. The text
     is already a URL, so it reads as a link without being painted like one. */
  .project-tech a {
    color: inherit;
    text-decoration: none;
  }

  /* === EDUCATION === */
  .edu-item {
    margin-bottom: 4px;
  }

  .edu-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }

  .edu-title {
    font-weight: 700;
    font-size: 12px;
    color: var(--ink);
  }

  .edu-org {
    color: var(--ink-soft);
    font-weight: 600;
  }

  .edu-year {
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
  }

  .edu-desc {
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
    line-height: 1.3;
  }

  /* The "Key Modules:" / "Achievement:" lead-in. Same size as its row — this is
     a label, not a heading, and scaling it up would compete with the degree. */
  .edu-label {
    font-weight: 600;
    color: var(--ink);
  }

  /* === SKILLS ===
     One category per line. The flex-wrap grid packed short categories two to a
     row, which reads as a run-on when every row is "Category: a, b, c". */
  .skills-grid {
    display: block;
  }

  .skill-item {
    display: block;
    font-size: 11px;
    line-height: 1.3;
    color: var(--ink-soft);
    margin-bottom: 1px;
  }

  .skill-category {
    font-weight: 700;
    color: var(--ink);
    font-size: 11px;
  }

  /* === PRINT === */
  @media print {
    body {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      padding: 0;
    }
  }

  /* === PAGE BREAK CONTROL === */
  .avoid-break,
  .job,
  .project,
  .edu-item {
    break-inside: avoid;
    page-break-inside: avoid;
  }

  /* === RTL (Arabic) Support === */
  html[lang="ar"] body {
    direction: rtl;
    text-align: right;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  }

  html[lang="ar"] .header h1,
  html[lang="ar"] .section-title,
  html[lang="ar"] .job-company,
  html[lang="ar"] .project-title,
  html[lang="ar"] .skill-category {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  }

  html[lang="ar"] .job ul,
  html[lang="ar"] .project-bullets {
    padding-right: 16px;
    padding-left: 0;
  }

  html[lang="ar"] .project-badge {
    margin-right: 8px;
    margin-left: 0;
  }

</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div class="header avoid-break">
    <h1>{{NAME}}</h1>
    {{TARGET_ROLE}}
    <div class="header-gradient"></div>
    <div class="contact-row">
      <a href="tel:{{PHONE_TEL}}" class="contact-plain">{{PHONE}}</a>
      <span class="separator">|</span>
      <a href="mailto:{{EMAIL}}" class="contact-plain">{{EMAIL}}</a>
      <span class="separator">|</span>
      <a href="{{LINKEDIN_URL}}">{{LINKEDIN_DISPLAY}}</a>
      <span class="separator">|</span>
      <a href="{{PORTFOLIO_URL}}">{{PORTFOLIO_DISPLAY}}</a>
      <span class="separator">|</span>
      <span>{{LOCATION}}</span>
    </div>
  </div>

  <!-- PROFESSIONAL SUMMARY -->
  <div class="section avoid-break">
    <div class="section-title">{{SECTION_SUMMARY}}</div>
    <div class="summary-text">{{SUMMARY_TEXT}}</div>
  </div>

  <!-- SKILLS — directly under the summary, where a reader and a keyword scan
       both look first. It used to render last, below Certifications on page 2. -->
  <div class="section avoid-break">
    <div class="section-title">{{SECTION_SKILLS}}</div>
    {{SKILLS}}
  </div>

  <!-- WORK EXPERIENCE -->
  <div class="section">
    <div class="section-title">{{SECTION_EXPERIENCE}}</div>
    {{EXPERIENCE}}
  </div>

  <!-- PROJECTS -->
  <div class="section avoid-break">
    <div class="section-title">{{SECTION_PROJECTS}}</div>
    {{PROJECTS}}
  </div>

  <!-- EDUCATION & CERTIFICATIONS — one section. Certifications had its own rule
       and heading, 42px of chrome to carry two lines of content. -->
  <div class="section avoid-break">
    <div class="section-title">{{SECTION_EDUCATION}}</div>
    {{EDUCATION}}
  </div>

</div>
</body>
</html>
